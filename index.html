<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird - Full Screen</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: skyblue;
        }

        h2, p {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-shadow: 2px 2px 4px black;
            z-index: 10;
            margin: 0;
        }

        h2 {
            top: 10px;
        }

        p {
            top: 50px;
        }

        canvas {
            display: block;
            background-color: lightblue;
        }
    </style>
</head>

<body>

<h2>Flappy Bird</h2>
<p>Tap Screen / Click Mouse / Press Space to Jump</p>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Full screen canvas
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    // Bird
    const bird = {
        x: 80,
        y: canvas.height / 2,
        width: 30,
        height: 30,
        velocity: 0
    };

    const gravity = 0.5;
    const jump = -8;

    // Pipe
    let pipeX = canvas.width;
    const pipeWidth = 60;
    const pipeGap = 150;
    let pipeTop = Math.random() * 250 + 50;

    let score = 0;
    let gameOver = false;

    function resetGame() {
        bird.y = canvas.height / 2;
        bird.velocity = 0;

        pipeX = canvas.width;
        pipeTop = Math.random() * 250 + 50;

        score = 0;
        gameOver = false;
    }

    function update() {
        if (gameOver) return;

        // Bird physics
        bird.velocity += gravity;
        bird.y += bird.velocity;

        // Move pipe
        pipeX -= 3;

        // Create new pipe
        if (pipeX + pipeWidth < 0) {
            pipeX = canvas.width;
            pipeTop = Math.random() * 250 + 50;
            score++;
        }

        // Collision with top/bottom
        if (
            bird.y <= 0 ||
            bird.y + bird.height >= canvas.height
        ) {
            gameOver = true;
        }

        // Collision with pipe
        if (
            bird.x + bird.width > pipeX &&
            bird.x < pipeX + pipeWidth &&
            (
                bird.y < pipeTop ||
                bird.y + bird.height > pipeTop + pipeGap
            )
        ) {
            gameOver = true;
        }
    }

    function draw() {
        // Clear screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw bird
        ctx.fillStyle = "yellow";
        ctx.fillRect(
            bird.x,
            bird.y,
            bird.width,
            bird.height
        );

        // Draw pipes
        ctx.fillStyle = "green";

        // Top pipe
        ctx.fillRect(
            pipeX,
            0,
            pipeWidth,
            pipeTop
        );

        // Bottom pipe
        ctx.fillRect(
            pipeX,
            pipeTop + pipeGap,
            pipeWidth,
            canvas.height - pipeTop - pipeGap
        );

        // Draw score
        ctx.fillStyle = "black";
        ctx.font = "28px Arial";
        ctx.fillText("Score: " + score, 10, 40);

        // Game over text
        if (gameOver) {
            ctx.font = "40px Arial";
            ctx.fillText(
                "Game Over",
                canvas.width / 2 - 120,
                canvas.height / 2
            );

            ctx.font = "20px Arial";
            ctx.fillText(
                "Tap / Click / Space to Restart",
                canvas.width / 2 - 160,
                canvas.height / 2 + 40
            );
        }
    }

    function gameLoop() {
        update();
        draw();

        requestAnimationFrame(gameLoop);
    }

    function flap() {
        if (gameOver) {
            resetGame();
        } else {
            bird.velocity = jump;
        }
    }

    // Keyboard control
    document.addEventListener("keydown", function(event) {
        if (event.code === "Space") {
            event.preventDefault();
            flap();
        }
    });

    // Mouse control
    canvas.addEventListener("click", function() {
        flap();
    });

    // Mobile touch control
    canvas.addEventListener("touchstart", function(event) {
        event.preventDefault();
        flap();
    });

    gameLoop();
</script>

</body>
</html>
